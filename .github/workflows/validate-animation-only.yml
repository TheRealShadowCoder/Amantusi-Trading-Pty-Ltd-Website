name: Validate Animation-Only Upgrade

on:
  push:
    branches:
      - animation-only-luxury-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Validate animation-only platform
        run: |
          set -euo pipefail
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
