name: Validate Responsive Performance V3

on:
  push:
    branches:
      - performance-responsive-word-motion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate scripts and Worker bundle
        run: |
          set -euo pipefail
          npm run check
          test -f public/performance-v3.js
          test -f public/performance-v3.css
          grep -q 'performance-v3.js' src/worker.js
          grep -q 'performance-v3.css' src/worker.js
          grep -q 'requestIdleCallback' public/performance-v3.js
          grep -q 'PerformanceObserver' public/performance-v3.js
          grep -q 'content-visibility:auto' public/performance-v3.css
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
