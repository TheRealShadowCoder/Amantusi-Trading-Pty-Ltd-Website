name: Validate 500 Effect Animation Registry

on:
  push:
    branches:
      - animation-registry-500
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Validate scripts and Cloudflare bundle
        run: |
          set -euo pipefail
          npm run check
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('public/animation-registry.js','utf8');
          const families=['hero','typography','sections','controls','cards','network','objects3d','shaders','touch','transitions'];
          for(const family of families){if(!src.includes(`${family}: [`))throw new Error(`Missing animation family ${family}`)}
          if(!src.includes('registry.length !== 500'))throw new Error('500-effect registry integrity guard missing');
          console.log('Animation registry source integrity checks passed.');
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
