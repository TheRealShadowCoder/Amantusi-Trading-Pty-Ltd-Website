name: Validate Luxury Quote UI

on:
  push:
    branches:
      - luxury-quote-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate luxury UI and optimized Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q 'luxury-ui.css' src/worker.js
          grep -q 'luxury-ui.js' src/worker.js
          grep -q 'hover-objects.js' src/worker.js
          grep -q 'wheel-fast.js' src/worker.js
          grep -q 'AmantusiLuxuryUI' public/luxury-ui.js
          grep -q 'lux-upload-zone' public/luxury-ui.js
          grep -q 'lux-success-overlay' public/luxury-ui.css
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
