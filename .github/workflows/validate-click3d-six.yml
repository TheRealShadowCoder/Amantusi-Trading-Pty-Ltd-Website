name: Validate Click 3D Six Families

on:
  push:
    branches: [click3d-six-families]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate six-family click 3D engine
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q "ring-burst" public/click-3d-fx.js
          grep -q "glass-gold" public/click-3d-fx.js
          grep -q "orbital-node" public/click-3d-fx.js
          grep -q "ripple-depth" public/click-3d-fx.js
          grep -q "spark-wave" public/click-3d-fx.js
          grep -q "mini-swarm" public/click-3d-fx.js
          grep -q "c3d-mini-object" public/click-3d-fx.css
          grep -q "click-3d-fx.js" src/worker.js
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
