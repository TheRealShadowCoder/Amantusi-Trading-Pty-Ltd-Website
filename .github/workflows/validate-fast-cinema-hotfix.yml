name: Validate Fast People-Free Cinema Hotfix

on:
  push:
    branches: [hotfix-no-people-fast-cinema]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate cinema hotfix
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('public/service-background.js','utf8');
          const css=fs.readFileSync('public/service-background.css','utf8');
          const injector=fs.readFileSync('scripts/inject-service-background.mjs','utf8');
          if(!js.includes('const INTERVAL=9000')) throw new Error('9-second interval missing');
          if(!js.includes('const ANIMATIONS_PER_SCENE=5')) throw new Error('five animations per scene missing');
          if(!js.includes("stage.className='svc-cinema-global svc-object-photography'")) throw new Error('single global stage missing');
          if(js.includes('hostSelectors') || js.includes('buildHost(')) throw new Error('legacy multi-stage background runtime still present');
          if(!js.includes('PHOTO_WIDTH=mobile||saveData||lowDevice?960:1600')) throw new Error('responsive background widths missing');
          if(!css.includes('body.perf-scrolling .svc-cinema-frame>i')) throw new Error('scroll pressure pause missing');
          if(!css.includes("--cin-in:cinIris") || !css.includes("--cin-in:cinDiagonal") || !css.includes("--cin-in:cinFocus")) throw new Error('cinematic transition families missing');
          const ids=[16924265,23625701,6340707,7718661,38155168,5217779,28576626,20551982,32611691,29086310];
          for(const id of ids) if(!injector.includes(`pexelsId: ${id}`)) throw new Error(`approved photo ${id} missing`);
          const banned=[34221998,4481326,9930276,10566526,4440525,17811675,15249758,4481260];
          for(const id of banned) if(injector.includes(String(id))) throw new Error(`old/risky photo ${id} still present`);
          if((injector.match(/policy: 'objects-only-no-people'/g)||[]).length!==10) throw new Error('expected ten strict photo policy entries');
          if(!injector.includes('allowedWidths = [640, 960, 1280, 1600]')) throw new Error('responsive image proxy widths missing');
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
