name: Deploy Amantusi to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: amantusi-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Deploy and verify Amantusi Worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler deploy | tee /tmp/wrangler-deploy.log
          else
            echo "Permanent Cloudflare secrets are not configured; publishing a temporary verification build."
            npx wrangler deploy --temporary | tee /tmp/wrangler-deploy.log
          fi

          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Worker deployed, but no workers.dev URL was available for an automated smoke test."
            exit 0
          fi

          echo "Verifying: $WORKER_URL/api/admin/status"
          STATUS="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WORKER_URL/api/admin/status")"
          echo "$STATUS"
          echo "$STATUS" | grep -q '"ready":true'
          echo "$STATUS" | grep -q '"loginConfigured":true'
          echo "$STATUS" | grep -q '"contentStorage":true'
          echo "$STATUS" | grep -q '"mediaStorage":true'
          echo "Admin backend smoke test passed."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
