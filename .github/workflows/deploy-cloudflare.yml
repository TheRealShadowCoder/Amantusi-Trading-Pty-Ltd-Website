name: Verify Amantusi Cloudflare Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed admin backend
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="https://amantusi-trading-pty-ltd-site.piquant-outrigger.workers.dev"
          STATUS=""
          CODE=""
          for attempt in {1..10}; do
            CODE="$(curl --silent --show-error --output /tmp/status.json --write-out '%{http_code}' "$WORKER_URL/api/admin/status" || true)"
            echo "Attempt $attempt returned HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              STATUS="$(cat /tmp/status.json)"
              break
            fi
            sleep 3
          done
          test "$CODE" = "200"
          echo "$STATUS"
          echo "$STATUS" | grep -q '"ready":true'
          echo "$STATUS" | grep -q '"loginConfigured":true'
          echo "$STATUS" | grep -q '"contentStorage":true'
          echo "$STATUS" | grep -q '"mediaStorage":true'
          echo "Admin backend smoke test passed."
