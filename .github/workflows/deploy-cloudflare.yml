name: Deploy Amantusi to Permanent Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: amantusi-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Worker and client scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check src/security-v2.js
          node --check src/worker.js
          node --check public/touch.js
          node --check public/admin.js
          node --check public/app.js
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Deploy the same Amantusi Worker
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Permanent deployment skipped. Add CLOUDFLARE_API_TOKEN as a GitHub Actions repository secret."
            exit 0
          fi
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
