name: Generate Amantusi Cloudflare Claim

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create one-time Cloudflare claim deployment
        run: npx wrangler deploy --temporary
