name: Deploy Amantusi Platform to Permanent Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amantusi-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate application and Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Assert Google-only static admin entry
        shell: bash
        run: |
          set -euo pipefail
          test -f public/admin.html
          test -f public/admin-dashboard.html
          grep -q 'Continue with Google' public/admin.html
          grep -q 'google-signin-button' public/admin.html
          grep -q 'href="/api/admin/google/oauth/start"' public/admin.html
          if grep -q 'admin-google-login.js' public/admin.html || grep -q 'accounts.google.com/gsi/client' public/admin.html || grep -q 'id="admin-password"' public/admin.html || grep -q 'id="login-form"' public/admin.html || grep -q 'Login as Administrator' public/admin.html; then
            echo "::error::public/admin.html contains obsolete GIS or password-login markup."
            exit 1
          fi
          printf '%s\n' "{\"sha\":\"${GITHUB_SHA}\",\"runId\":\"${GITHUB_RUN_ID}\",\"runNumber\":\"${GITHUB_RUN_NUMBER}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"adminMode\":\"google-oauth-redirect\"}" > public/deployment.json
          cat public/deployment.json

      - name: Sync Google OAuth credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -n "$GOOGLE_SIGNIN_CLIENT_ID" ]; then
            printf '%s' "$GOOGLE_SIGNIN_CLIENT_ID" | npx wrangler secret put GOOGLE_SIGNIN_CLIENT_ID
          else
            echo "::warning::GOOGLE_SIGNIN_CLIENT_ID is not present in GitHub secrets; preserving the existing Worker secret if one exists."
          fi
          if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET
          else
            echo "::warning::GOOGLE_OAUTH_CLIENT_SECRET is not present in GitHub secrets yet. The new login page will deploy, but OAuth code exchange will remain unavailable until this secret is added and the workflow is rerun."
          fi

      - name: Deploy permanent Amantusi Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler deploy --keep-vars 2>&1 | tee /tmp/wrangler-deploy.log
          PRODUCTION_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$PRODUCTION_URL" ]; then
            PRODUCTION_URL="https://amantusi-trading-pty-ltd-website.dolomite-computer.workers.dev"
          fi
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "Production URL: $PRODUCTION_URL"

      - name: Verify exact live build and Google admin entry
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 15); do
            build_ok=0
            ui_ok=0
            header_ok=0
            google_ok=0
            oauth_ok=0
            guard_ok=0

            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/deployment.json?sha=$GITHUB_SHA&t=$attempt" -o /tmp/deployment.json; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8"));if(x.sha!==process.env.GITHUB_SHA||x.adminMode!=="google-oauth-redirect")process.exit(1);'; then
                build_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 -D /tmp/admin.headers "$PRODUCTION_URL/admin.html?sha=$GITHUB_SHA&t=$attempt" -o /tmp/admin.html; then
              if grep -q 'Continue with Google' /tmp/admin.html && grep -q 'href="/api/admin/google/oauth/start"' /tmp/admin.html && ! grep -q 'admin-google-login.js' /tmp/admin.html && ! grep -q 'accounts.google.com/gsi/client' /tmp/admin.html && ! grep -q 'id="admin-password"' /tmp/admin.html; then
                ui_ok=1
              fi
              if grep -qi '^x-amantusi-admin-mode: google-only' /tmp/admin.headers && grep -qi '^cache-control: .*no-store' /tmp/admin.headers; then
                header_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/admin/google/config?t=$attempt" -o /tmp/google.json; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/google.json","utf8"));const expected=String(process.env.GOOGLE_SIGNIN_CLIENT_ID||"").trim();if(!x.flowId||!x.nonce||x.preferredFlow!=="redirect")process.exit(1);if(expected&&x.clientId!==expected)process.exit(1);'; then
                google_ok=1
              fi
            fi

            if [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; then
              oauth_code=$(curl --silent --show-error --max-time 20 -o /dev/null -D /tmp/oauth.headers -w '%{http_code}' "$PRODUCTION_URL/api/admin/google/oauth/start?t=$attempt" || true)
              if [ "$oauth_code" = "302" ] && grep -qi '^location: https://accounts.google.com/o/oauth2/v2/auth' /tmp/oauth.headers; then
                oauth_ok=1
              fi
            else
              oauth_ok=1
            fi

            code=$(curl --silent --show-error --max-time 20 -o /dev/null -D /tmp/dashboard.headers -w '%{http_code}' "$PRODUCTION_URL/admin-dashboard.html?t=$attempt" || true)
            if [ "$code" = "302" ] && grep -qi '^location: /admin.html' /tmp/dashboard.headers; then
              guard_ok=1
            fi

            echo "Live check $attempt/15: build=$build_ok ui=$ui_ok headers=$header_ok google=$google_ok oauthRedirect=$oauth_ok dashboardGuard=$guard_ok"
            if [ "$build_ok" -eq 1 ] && [ "$ui_ok" -eq 1 ] && [ "$header_ok" -eq 1 ] && [ "$google_ok" -eq 1 ] && [ "$oauth_ok" -eq 1 ] && [ "$guard_ok" -eq 1 ]; then
              success=1
              break
            fi
            sleep 4
          done

          if [ "$success" -eq 1 ]; then
            echo "Exact Google OAuth redirect admin build is live."
            cat /tmp/deployment.json
            exit 0
          fi

          echo "::warning::Cloudflare publish completed, but one or more advisory live checks did not converge yet."
          [ -f /tmp/deployment.json ] && cat /tmp/deployment.json || true
          [ -f /tmp/admin.headers ] && cat /tmp/admin.headers || true
          [ -f /tmp/admin.html ] && head -100 /tmp/admin.html || true
          [ -f /tmp/oauth.headers ] && cat /tmp/oauth.headers || true
          exit 1

      - name: Dependency security audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Extended health check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health" | tee /tmp/health.json
