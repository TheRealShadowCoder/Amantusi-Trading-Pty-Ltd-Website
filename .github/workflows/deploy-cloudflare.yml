name: Deploy Amantusi Platform to Permanent Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amantusi-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate application and Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          test -f public/admin.html
          test -f public/admin-dashboard.html
          grep -q 'Continue with Google' public/admin.html
          grep -q 'google-signin-button' public/admin.html
          grep -q '/admin-google-login.js' public/admin.html
          if grep -q 'id="admin-password"' public/admin.html || grep -q 'id="login-form"' public/admin.html || grep -q 'Login as Administrator' public/admin.html; then
            echo "::error::public/admin.html still contains legacy password login markup."
            exit 1
          fi

      - name: Record exact build marker
        shell: bash
        run: |
          set -euo pipefail
          cat > public/deployment.json <<EOF
          {"sha":"${GITHUB_SHA}","runId":"${GITHUB_RUN_ID}","runNumber":"${GITHUB_RUN_NUMBER}","deployedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","adminMode":"google-only"}
          EOF
          cat public/deployment.json

      - name: Dependency security audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Check Cloudflare account
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler whoami

      - name: Require production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
          if [ -z "$GOOGLE_SIGNIN_CLIENT_ID" ]; then
            echo "::error::GOOGLE_SIGNIN_CLIENT_ID is required for Google-only admin login."
            exit 1
          fi
          case "$GOOGLE_SIGNIN_CLIENT_ID" in
            *.apps.googleusercontent.com) ;;
            *) echo "::error::GOOGLE_SIGNIN_CLIENT_ID does not look like a Google Web client ID."; exit 1 ;;
          esac

      - name: Sync Google Sign-In client ID
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SIGNIN_CLIENT_ID" | npx wrangler secret put GOOGLE_SIGNIN_CLIENT_ID

      - name: Sync optional Google overflow key
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GCP_WIF_PRIVATE_KEY: ${{ secrets.GCP_WIF_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GCP_WIF_PRIVATE_KEY" ]; then
            echo "GCP overflow key is not configured; continuing without overflow."
            exit 0
          fi
          printf '%s' "$GCP_WIF_PRIVATE_KEY" | npx wrangler secret put GCP_WIF_PRIVATE_KEY

      - name: Deploy exact production build
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          PRODUCTION_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$PRODUCTION_URL" ]; then
            PRODUCTION_URL="https://amantusi-trading-pty-ltd-website.dolomite-computer.workers.dev"
          fi
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "Production URL: $PRODUCTION_URL"

      - name: Verify exact live Google-only build
        shell: bash
        env:
          GOOGLE_SIGNIN_CLIENT_ID: ${{ secrets.GOOGLE_SIGNIN_CLIENT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            build_ok=0
            ui_ok=0
            header_ok=0
            google_ok=0
            guard_ok=0

            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/deployment.json?sha=$GITHUB_SHA&t=$attempt" -o /tmp/deployment.json; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/deployment.json","utf8"));if(x.sha!==process.env.GITHUB_SHA||x.adminMode!=="google-only")process.exit(1);'; then
                build_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 -D /tmp/admin.headers "$PRODUCTION_URL/admin.html?sha=$GITHUB_SHA&t=$attempt" -o /tmp/admin.html; then
              if grep -q 'Continue with Google' /tmp/admin.html && grep -q 'google-signin-button' /tmp/admin.html && ! grep -q 'id="admin-password"' /tmp/admin.html && ! grep -q 'Login as Administrator' /tmp/admin.html; then
                ui_ok=1
              fi
              if grep -qi '^x-amantusi-admin-mode: google-only' /tmp/admin.headers && grep -qi '^cache-control: .*no-store' /tmp/admin.headers; then
                header_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/admin/google/config?t=$attempt" -o /tmp/google.json; then
              if node - <<'NODE'
const fs = require('fs');
const x = JSON.parse(fs.readFileSync('/tmp/google.json','utf8'));
const expected = String(process.env.GOOGLE_SIGNIN_CLIENT_ID || '').trim();
if (!expected || x.clientId !== expected || !x.flowId || !x.nonce || Number(x.expiresIn) <= 0) process.exit(1);
NODE
              then
                google_ok=1
              fi
            fi

            code=$(curl --silent --show-error --max-time 20 -o /dev/null -D /tmp/dashboard.headers -w '%{http_code}' "$PRODUCTION_URL/admin-dashboard.html?t=$attempt" || true)
            if [ "$code" = "302" ] && grep -qi '^location: /admin.html' /tmp/dashboard.headers; then
              guard_ok=1
            fi

            if [ "$build_ok" -eq 1 ] && [ "$ui_ok" -eq 1 ] && [ "$header_ok" -eq 1 ] && [ "$google_ok" -eq 1 ] && [ "$guard_ok" -eq 1 ]; then
              echo "Exact Google-only admin build is live."
              cat /tmp/deployment.json
              exit 0
            fi

            echo "Propagation $attempt/30: build=$build_ok ui=$ui_ok headers=$header_ok google=$google_ok dashboardGuard=$guard_ok"
            sleep 4
          done

          echo "::error::Production did not converge to the exact Google-only build."
          [ -f /tmp/deployment.json ] && cat /tmp/deployment.json || true
          [ -f /tmp/admin.headers ] && cat /tmp/admin.headers || true
          [ -f /tmp/admin.html ] && head -100 /tmp/admin.html || true
          exit 1

      - name: Extended health check
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health" | tee /tmp/health.json

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amantusi-release-diagnostics-${{ github.run_number }}
          path: |
            /tmp/wrangler-deploy.log
            /tmp/deployment.json
            /tmp/admin.headers
            /tmp/admin.html
            /tmp/google.json
            /tmp/health.json
          if-no-files-found: ignore
          retention-days: 14
