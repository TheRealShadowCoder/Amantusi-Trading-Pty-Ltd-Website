name: Deploy Amantusi Platform to Permanent Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: amantusi-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Worker and client platform
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Verify permanent Cloudflare account
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_ACCOUNT_ID="3b4dba2eec2c69b95eae20d70941e9b2"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler whoami 2>&1 | tee /tmp/wrangler-whoami.log
          if ! grep -q "$EXPECTED_ACCOUNT_ID" /tmp/wrangler-whoami.log; then
            echo "::error::Cloudflare token is not scoped to the permanent Amantusi account $EXPECTED_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy permanent Amantusi Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          PRODUCTION_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::Wrangler did not report the production workers.dev URL."
            exit 1
          fi
          echo "PRODUCTION_URL=$PRODUCTION_URL" >> "$GITHUB_ENV"
          echo "Production URL: $PRODUCTION_URL"

      - name: Smoke test platform resources and admin backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            homepage_ok=0
            admin_ok=0
            platform_ok=0
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/" -o /tmp/amantusi-home.html && grep -qi "AMANTUSI" /tmp/amantusi-home.html; then homepage_ok=1; fi
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/admin/status" -o /tmp/amantusi-status.json; then
              if node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("/tmp/amantusi-status.json","utf8"));if(!(s.ready&&s.loginConfigured&&s.contentStorage&&s.mediaStorage&&s.authVersion===3))process.exit(1);'; then admin_ok=1; fi
            fi
            if curl --fail --silent --show-error --max-time 20 "$PRODUCTION_URL/api/health" -o /tmp/amantusi-health.json; then
              if node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("/tmp/amantusi-health.json","utf8"));if(!(s.ok&&s.kv&&s.database&&["r2","kv-fallback"].includes(s.mediaBackend)&&s.platformVersion===2))process.exit(1);'; then platform_ok=1; fi
            fi
            if [ "$homepage_ok" -eq 1 ] && [ "$admin_ok" -eq 1 ] && [ "$platform_ok" -eq 1 ]; then
              echo "Permanent Amantusi platform is healthy."
              cat /tmp/amantusi-health.json
              exit 0
            fi
            echo "Waiting for Worker/D1 propagation (attempt $attempt/18)..."
            sleep 5
          done
          echo "::error::Production health checks did not converge."
          [ -f /tmp/amantusi-status.json ] && cat /tmp/amantusi-status.json || true
          [ -f /tmp/amantusi-health.json ] && cat /tmp/amantusi-health.json || true
          exit 1

      - name: Install Chromium for production QA
        run: npx playwright install --with-deps chromium

      - name: Run Playwright production tests
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:e2e

      - name: Run Lighthouse budgets
        env:
          BASE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run test:lighthouse

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amantusi-production-qa-${{ github.run_number }}
          path: |
            playwright-report
            test-results
            lighthouse-report
          if-no-files-found: ignore
          retention-days: 14
