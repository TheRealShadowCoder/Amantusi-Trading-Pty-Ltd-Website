name: Validate Advanced 20 Click Animations

on:
  push:
    branches: [advanced20-click-map]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate advanced 20 animation runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q "AmantusiAdvanced20" public/click-advanced20.js
          grep -q "liquid-metal-morph" public/click-advanced20.js
          grep -q "energy-tunnel" public/click-advanced20.js
          grep -q "hologram-scan" public/click-advanced20.js
          grep -q "magnetic-fragment-recall" public/click-advanced20.js
          grep -q "shock-cone" public/click-advanced20.js
          grep -q "light-pillar" public/click-advanced20.js
          grep -q "wireframe-reveal" public/click-advanced20.js
          grep -q "hex-grid" public/click-advanced20.js
          grep -q "domino-wave" public/click-advanced20.js
          grep -q "page-fold" public/click-advanced20.js
          grep -q "gravity-well" public/click-advanced20.js
          grep -q "crystal-growth" public/click-advanced20.js
          grep -q "plasma-arc" public/click-advanced20.js
          grep -q "depth-slice" public/click-advanced20.js
          grep -q "radar-sweep" public/click-advanced20.js
          grep -q "vortex-implosion" public/click-advanced20.js
          grep -q "light-ribbon" public/click-advanced20.js
          grep -q "satellite-deployment" public/click-advanced20.js
          grep -q "prismatic-refraction" public/click-advanced20.js
          grep -q "constellation-draw" public/click-advanced20.js
          grep -q "click-advanced20.css" src/worker.js
          grep -q "click-advanced20.js" src/worker.js
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
