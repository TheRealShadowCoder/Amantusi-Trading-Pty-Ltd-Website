name: Validate Fast Mouse Wheel

on:
  push:
    branches:
      - fast-mouse-wheel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate wheel runtime and Worker bundle
        run: |
          set -euo pipefail
          npm run check
          grep -q 'wheel-fast.js' src/worker.js
          grep -q 'passive: false' public/wheel-fast.js
          grep -q 'AmantusiWheel' public/wheel-fast.js
          grep -q 'perf-wheel-active' public/performance-v3.css
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
