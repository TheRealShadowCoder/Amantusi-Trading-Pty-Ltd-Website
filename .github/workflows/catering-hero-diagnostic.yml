name: Diagnose catering mobile heading
on:
  push:
    branches: [feature/mobile-adaptive-webgl-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect mobile hero computed styles
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/diag-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/catering-hero-diagnostic.spec.mjs --project=desktop-chromium
