name: Validate Hover Only Animations

on:
  push:
    branches:
      - hover-only-object-animations
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate hover runtime and optimized Worker
        run: |
          set -euo pipefail
          npm run check
          grep -q 'AmantusiHoverObjects' public/hover-objects.js
          grep -q 'ar3d-hover-active' public/hover-objects.css
          grep -q 'animation-play-state:paused' public/hover-objects.css
          grep -q 'hover-objects.css' src/worker.js
          grep -q 'hover-objects.js' src/worker.js
          grep -q 'wheel-fast.js' src/worker.js
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
