name: Validate Cinematic Service Backgrounds

on:
  push:
    branches: [cinematic-service-backgrounds]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate cinematic background runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q "AmantusiServiceBackground" public/service-background.js
          grep -q "INTERVAL=9000" public/service-background.js
          grep -q "count:services.length" public/service-background.js
          grep -q "SERVICE_BACKGROUND_IMAGES" src/worker.js
          grep -q "serviceBackgroundImage" src/worker.js
          grep -q "service-background.css" src/worker.js
          grep -q "service-background.js" src/worker.js
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('public/service-background.js','utf8');
          const services=[...js.matchAll(/\{id:(\d+),label:'([^']+)'\}/g)];
          if(services.length!==10) throw new Error(`expected 10 service backgrounds, got ${services.length}`);
          const ids=services.map(m=>Number(m[1]));
          if(ids.some((id,i)=>id!==i+1)) throw new Error('service image IDs must be 1..10');
          const worker=fs.readFileSync('src/worker.js','utf8');
          const photos=[...worker.matchAll(/images\.pexels\.com\/photos\/\d+/g)];
          if(photos.length!==10) throw new Error(`expected 10 Pexels image sources, got ${photos.length}`);
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
