name: Validate Fast Trackpad Cursor

on:
  push:
    branches:
      - fast-trackpad-cursor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate trackpad and cursor runtime
        run: |
          set -euo pipefail
          npm run check
          grep -q 'precisionEnabled' public/wheel-fast.js
          grep -q 'precisionMultiplier' public/wheel-fast.js
          grep -q 'queueCursorFrame(event.clientX,event.clientY)' public/experience.js
          grep -q 'cursorFrame=requestAnimationFrame' public/experience.js
          if grep -q 'cursorX+=(cursorTX-cursorX)\*.22' public/experience.js; then
            echo '::error::Legacy WebGL-frame cursor easing is still present.'
            exit 1
          fi
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
