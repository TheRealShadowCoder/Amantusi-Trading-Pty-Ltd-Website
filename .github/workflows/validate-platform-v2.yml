name: Validate Amantusi Platform

on:
  push:
    branches:
      - platform-v2-upgrade
      - 'perf/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: amantusi-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Public experience regression smoke tests
        run: node scripts/validate-site-smoke.mjs
      - name: Verify private RFQ media cannot use public object route
        run: node scripts/validate-media-privacy.mjs
      - name: Validate private R2 media binding and legacy KV compatibility
        run: node scripts/validate-storage-binding.mjs
      - name: Validate public HTML asset references
        run: node scripts/validate-public-routes.mjs
      - name: Verify approved brand text color contrasts
        run: node scripts/validate-brand-contrast.mjs
      - name: Validate upload file-type screening
        run: node scripts/validate-upload-security.mjs
      - name: Verify optional customer receipt security
        run: node scripts/validate-notification-receipt.mjs
      - name: Install Chromium for public-site browser tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile public-site browser tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public >/tmp/amantusi-static.log 2>&1 &
          echo $! >/tmp/amantusi-static.pid
          trap 'kill "$(cat /tmp/amantusi-static.pid)" || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/public-static.spec.mjs
      - name: Syntax and Wrangler validation
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/deploy-cloudflare.yml')"
          npm run check
          bash -n scripts/setup-gcp-cloudflare-wif.sh
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
