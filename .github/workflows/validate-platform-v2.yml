name: Validate Amantusi Platform

on:
  push:
    branches:
      - platform-v2-upgrade
      - 'perf/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax and Wrangler validation
        run: |
          set -euo pipefail
          npm run check
          bash -n scripts/setup-gcp-cloudflare-wif.sh
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
