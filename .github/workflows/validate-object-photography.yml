name: Validate Object Photography Cinema

on:
  push:
    branches: [object-photography-cinema]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate people-free photography cinema
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q "ANIMATIONS_PER_SCENE=5" public/service-background.js
          grep -q "INTERVAL=9000" public/service-background.js
          grep -q "object-photography-no-people" public/service-background.js
          grep -q "svc-photo" public/service-background.js
          grep -q "assets/amantusi-logo.svg" public/service-background.css
          grep -q "SERVICE_BACKGROUND_IMAGES" src/worker.js
          grep -q "objects-only-no-people" src/worker.js
          grep -q "path.startsWith('/service-bg/')" src/worker.js
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('public/service-background.js','utf8');
          const css=fs.readFileSync('public/service-background.css','utf8');
          const worker=fs.readFileSync('src/worker.js','utf8');
          const scenes=[...js.matchAll(/\{id:(\d+),label:/g)].map(m=>Number(m[1]));
          if(scenes.length!==10||scenes.some((id,i)=>id!==i+1)) throw new Error(`expected scenes 1..10, got ${scenes}`);
          const urls=[...worker.matchAll(/https:\/\/images\.pexels\.com\/photos\/(\d+)\/pexels-photo-\1\.jpeg/g)].map(m=>m[1]);
          const expected=['34221998','4481326','9930276','6340707','10566526','4440525','28576626','17811675','20551982','15249758'];
          if(urls.length!==10) throw new Error(`expected 10 image URLs, got ${urls.length}`);
          for(const id of expected) if(!urls.includes(id)) throw new Error(`missing approved object-only photo ${id}`);
          for(let scene=1;scene<=10;scene++){
            for(const suffix of ['Photo','Logo','Orbit','Light','Depth']){
              if(!css.includes(`svc${scene}${suffix}`)) throw new Error(`missing animation svc${scene}${suffix}`);
            }
          }
          const layers=['svc-photo','svc-logo-main','svc-photo-orbit','svc-photo-light','svc-photo-depth'];
          for(const layer of layers) if(!js.includes(layer)) throw new Error(`missing animation layer ${layer}`);
          NODE
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
