name: Validate Click 3D Reactions

on:
  push:
    branches:
      - click-3d-reaction-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate click 3D runtime and optimized Worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q 'AmantusiClick3D' public/click-3d-fx.js
          grep -q 'c3d-burst' public/click-3d-fx.css
          grep -q 'click-3d-fx.css' src/worker.js
          grep -q 'click-3d-fx.js' src/worker.js
          grep -q 'luxury-ui.js' src/worker.js
          grep -q 'hover-objects.js' src/worker.js
          grep -q 'wheel-fast.js' src/worker.js
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
